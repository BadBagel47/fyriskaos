<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2b2c2e" />
    <title>Fyriskaos – stiltest</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #2b2c2e; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #f2f1ee; }
      #view, #view canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #bar { position: fixed; left: max(8px, env(safe-area-inset-left)); top: max(8px, env(safe-area-inset-top)); right: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; pointer-events: none; }
      #bar > * { pointer-events: auto; }
      button { font: inherit; font-size: 14px; font-weight: 600; border: 0; border-radius: 999px; padding: 8px 14px; background: #f2f1ee; color: #1d1e20; box-shadow: 0 2px 6px #0006; }
      #btn-variant { background: #f0a43a; }
      #fps { font-size: 12px; padding: 4px 8px; border-radius: 6px; background: #000a; font-variant-numeric: tabular-nums; }
      #fps.good { color: #8fe38f; } #fps.ok { color: #f7d36b; } #fps.bad { color: #ff7b6b; }
      #info { position: fixed; left: max(8px, env(safe-area-inset-left)); bottom: max(8px, env(safe-area-inset-bottom)); right: 8px; font-size: 12px; text-shadow: 0 1px 2px #000; pointer-events: none; }
      #variant { font-weight: 700; font-size: 14px; }
      #info a { color: #f0a43a; pointer-events: auto; }
    </style>
  </head>
  <body>
    <div id="view"></div>
    <div id="bar">
      <button id="btn-variant">Byt stil</button>
      <button id="btn-quality">Kvalitet: auto</button>
      <button id="btn-pan">Kamera</button>
      <span id="fps">… fps</span>
    </div>
    <div id="info">
      <div id="variant"></div>
      <div id="note"></div>
      <div>Stiltest för Fyriskaos (D-043). All grafik är byggd med kod. Three.js (MIT). <a href="https://github.com/BadBagel47/fyriskaos/blob/main/CREDITS.md">Credits</a> · <a href="./">Till spelet</a></div>
    </div>
    <script type="module" src="stiltest/app.js"></script>
  </body>
</html>
