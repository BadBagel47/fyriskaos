<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2b2c2e" />
    <title>Fyriskaos – stiltest</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #2b2c2e; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #f2f1ee; }
      #view, #view canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #bar { position: fixed; right: max(6px, env(safe-area-inset-right)); top: max(6px, env(safe-area-inset-top)); display: flex; flex-direction: column; gap: 4px; align-items: flex-end; pointer-events: none; }
      #bar > * { pointer-events: auto; }
      button { font: inherit; font-size: 12px; font-weight: 600; border: 0; border-radius: 999px; padding: 6px 11px; background: #f2f1eecc; color: #1d1e20; box-shadow: 0 1px 4px #0005; }
      #btn-variant { background: #f0a43a; }
      #fps { font-size: 12px; padding: 4px 8px; border-radius: 6px; background: #000a; font-variant-numeric: tabular-nums; }
      #fps.good { color: #8fe38f; } #fps.ok { color: #f7d36b; } #fps.bad { color: #ff7b6b; }
      #info { position: fixed; left: max(6px, env(safe-area-inset-left)); bottom: max(6px, env(safe-area-inset-bottom)); max-width: min(70vw, 460px); font-size: 11px; line-height: 1.35; padding: 6px 9px; border-radius: 8px; background: #000a; pointer-events: none; transition: opacity 0.6s; }
      #info.small .more { display: none; }
      #variant { font-weight: 700; font-size: 13px; }
      #info a { color: #f0a43a; pointer-events: auto; }
    </style>
  </head>
  <body>
    <div id="view"></div>
    <div id="bar">
      <button id="btn-variant">Byt stil</button>
      <button id="btn-quality">Kvalitet: auto</button>
      <button id="btn-pan">Kamera</button>
      <span id="fps">… fps</span>
    </div>
    <div id="info">
      <div id="variant"></div>
      <div id="note" class="more"></div>
      <div class="more">Stiltest för Fyriskaos (D-043). All grafik är byggd med kod. Three.js (MIT). <a href="https://github.com/BadBagel47/fyriskaos/blob/main/CREDITS.md">Credits</a> · <a href="./">Till spelet</a></div>
    </div>
    <script>
      // The longer text folds away after a few seconds so it does not cover the houses.
      setTimeout(() => document.getElementById('info').classList.add('small'), 6000);
    </script>
    <script type="module" src="stiltest/app.js"></script>
  </body>
</html>
